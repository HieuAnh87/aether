<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect width="100" height="100" rx="22" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Hexagon outline -->
  <polygon points="50,8 87,29 87,71 50,92 13,71 13,29"
    fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Spokes vertex → center -->
  <path d="M50 8L50 50 M13 29L50 50 M87 29L50 50 M13 71L50 50 M87 71L50 50 M50 92L50 50"
    stroke="url(#g)" stroke-width="1.6" opacity="0.6"/>
  <!-- Center core -->
  <circle cx="50" cy="50" r="10" fill="url(#g)" filter="url(#glow)"/>
</svg>
